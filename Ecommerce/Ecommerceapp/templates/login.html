{% extends 'base.html' %}

{% block title %}Ecommerce Registration Success page{% endblock %}

{% block content %}
       <form action="home" method="post">
            {% csrf_token %}
             <table style="position: center;">
                <tr>
                    <td colspan="2"><h3 style="text-align: left;">Ecommerce Login:</h3></td>
                </tr> 
                    {% for i in messages %}
                    <h2 style="color: red;">{{i}}</h2>
                    {% endfor %}        
                 <tr>
                    <td><label>Enter user name:</label></td>
                    <td><input type="text" name="username" /></td>
                </tr>
                 <tr>
                    <td><label>Enter Password:</label></td>
                    <td><input type="password" name="password" /></td>
                </tr>
                <tr>
                    <td></td>
                    <td><input type="submit" value="Login" /></td>
                </tr>
             </table>
        </form>
{% endblock %}
